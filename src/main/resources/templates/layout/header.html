<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" media="screen">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
    <title>Home Products</title>
</head>

<body>

<div class="container">

    <div th:fragment="header">

        <!-- NAVBAR BOX -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light rounded-3 mt-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="#" th:href="@{/}">Home</a>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/ProductsDisplay}">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/Products/add}">Create Product</a>
                    </li>
                </ul>
            </div>
        </nav>


        <!-- HERO SECTION BOX (Spring MVC + image) -->
        <div class="bg-light rounded-3 p-3 mt-3">

            <div class="text-center">
                <h2>Spring MVC Application</h2>
            </div>

            <div class="d-flex justify-content-center align-items-center mt-3">
                <img class="img-fluid w-25"
                     th:src="@{/images/springs.png}" width="50%"
                     alt="spring logo">
            </div>

        </div>

    </div>

</div>

</body>
</html>
